<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t2 d2">
  <title id="t2">How the parts connect: the record outside, the people, the chat, the file, the copies outside</title>
  <desc id="d2">Left to right. The record outside the group (a transaction, an archived page, a dated file) is what a claim is about; a script reads it for one entry. A writer turns it into an entry and posts it in the chat; two members other than the writer open the link and post what they saw as CHECK posts (if the Saw line passes, they may run the script and open one link instead); members post VOTE on a rule change. The weekly turn, one member a week in Member order, pastes the week's chat into the weekly page and copies what it gives into ledger.txt: SEEN lines, new entries, vote counts; then posts the file's hash outside the chat. Two members with the same result close an entry. The posted hash, the Internet Archive and, once made, a Bitcoin stamp keep dated copies; the site is built from the texts and adds no rule.</desc>
  <style>
    text{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;fill:#111}
    .h{font-size:14px;font-weight:700;fill:#1f1a8c}
    .n{font-size:12px}
    .s{font-size:11px;fill:#333}
    .k{font-size:12px;font-weight:700}
    .box{fill:#fff;stroke:#000;stroke-width:1.5}
    .silver{fill:#d4d0c8;stroke:#000;stroke-width:1.5}
    .file{fill:#fffbe6;stroke:#000;stroke-width:1.5}
    .arrow{fill:none;stroke:#000;stroke-width:1.5;marker-end:url(#m2)}
    .lab{font-size:11px;font-weight:700;fill:#1f1a8c}
    .barfill{fill:#000080}
    .bart{font-size:13px;font-weight:700;fill:#fff}
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="700" fill="#fff"/>

  <rect x="20" y="16" width="920" height="26" class="barfill"/>
  <text x="32" y="34" class="bart">how the parts connect: the record outside → people → the chat → the file → copies outside</text>

  <!-- column heads -->
  <text x="20" y="72" class="h">THE RECORD OUTSIDE</text>
  <text x="215" y="72" class="h">PEOPLE</text>
  <text x="440" y="72" class="h">THE CHAT</text>
  <text x="600" y="72" class="h">THE FILE</text>
  <text x="800" y="72" class="h">COPIES OUTSIDE</text>

  <!-- A: the record -->
  <rect x="20" y="84" width="170" height="190" class="box"/>
  <rect x="20" y="84" width="170" height="24" class="silver"/>
  <text x="30" y="101" class="k">what a claim is about</text>
  <text x="30" y="130" class="n">a transaction</text>
  <text x="30" y="148" class="n">an archived page</text>
  <text x="30" y="166" class="n">a dated file</text>
  <text x="30" y="196" class="s">nobody in the group</text>
  <text x="30" y="211" class="s">controls it. Every</text>
  <text x="30" y="226" class="s">entry's LINK opens</text>
  <text x="30" y="241" class="s">here, for anyone,</text>
  <text x="30" y="256" class="s">without an account.</text>

  <!-- script -->
  <rect x="20" y="300" width="170" height="136" class="box"/>
  <rect x="20" y="300" width="170" height="24" class="silver"/>
  <text x="30" y="317" class="k">a script</text>
  <text x="30" y="346" class="n">reads the record for</text>
  <text x="30" y="362" class="n">one entry and prints</text>
  <text x="30" y="378" class="n">which WRONG IF lines</text>
  <text x="30" y="394" class="n">tripped</text>
  <text x="30" y="416" class="s">a helper now; a Saw</text>
  <text x="30" y="430" class="s">if the vote passes</text>

  <!-- B: people -->
  <rect x="215" y="84" width="200" height="90" class="box"/>
  <rect x="215" y="84" width="200" height="24" class="silver"/>
  <text x="225" y="101" class="k">a writer (anyone)</text>
  <text x="225" y="128" class="n">writes an entry: SAYS,</text>
  <text x="225" y="144" class="n">LINK, WRONG IF</text>
  <text x="225" y="164" class="s">the write page lays it out</text>

  <rect x="215" y="196" width="200" height="130" class="box"/>
  <rect x="215" y="196" width="200" height="24" class="silver"/>
  <text x="225" y="213" class="k">two checkers (members)</text>
  <text x="225" y="240" class="n">not the writer. Each</text>
  <text x="225" y="256" class="n">opens the link and says</text>
  <text x="225" y="272" class="n">what they saw. Only if</text>
  <text x="225" y="288" class="n">the Saw line passes may</text>
  <text x="225" y="304" class="n">a script run count too</text>
  <text x="225" y="320" class="s">the check card writes it</text>

  <rect x="215" y="348" width="200" height="88" class="box"/>
  <rect x="215" y="348" width="200" height="24" class="silver"/>
  <text x="225" y="365" class="k">a voter (members)</text>
  <text x="225" y="392" class="n">"yes" or "object" on a</text>
  <text x="225" y="408" class="n">rule change, in 7 days</text>
  <text x="225" y="428" class="s">your next move has buttons</text>

  <!-- C: the chat -->
  <rect x="440" y="84" width="140" height="352" class="box"/>
  <rect x="440" y="84" width="140" height="24" class="silver"/>
  <text x="450" y="101" class="k">posts, one each</text>
  <text x="450" y="130" class="k">ENTRY</text>
  <text x="450" y="146" class="s">FACT 10 · Laura</text>
  <text x="450" y="161" class="s">· 2026-10-16</text>
  <text x="450" y="250" class="k">CHECK</text>
  <text x="450" y="266" class="s">FACT 8 · HOLDS</text>
  <text x="450" y="281" class="s">· lines 1,3 · Merc</text>
  <text x="450" y="296" class="s">· 2026-10-17</text>
  <text x="450" y="311" class="s">New: a new thing</text>
  <text x="450" y="388" class="k">VOTE</text>
  <text x="450" y="404" class="s">YES · the Saw line</text>
  <text x="450" y="419" class="s">· Ksizzle · date</text>

  <!-- D: the file -->
  <rect x="600" y="84" width="180" height="352" class="file"/>
  <rect x="600" y="84" width="180" height="24" class="silver"/>
  <text x="610" y="101" class="k">ledger.txt</text>
  <text x="610" y="130" class="k">entries</text>
  <text x="610" y="146" class="s">each with its SEEN lines</text>
  <text x="610" y="161" class="s">as the checks come in</text>
  <text x="610" y="186" class="k">closed</text>
  <text x="610" y="202" class="s">two members, same</text>
  <text x="610" y="217" class="s">result on the same lines</text>
  <text x="610" y="232" class="s">(rule 3): HOLDS or not</text>
  <text x="610" y="262" class="k">the rules</text>
  <text x="610" y="278" class="s">changed only by a vote;</text>
  <text x="610" y="293" class="s">old wording archived</text>
  <text x="610" y="323" class="k">PROMISE 7</text>
  <text x="610" y="339" class="s">the group's goal: three</text>
  <text x="610" y="354" class="s">other entries closed in</text>
  <text x="610" y="369" class="s">30 days after adoption.</text>
  <text x="610" y="384" class="s">Counted from this file.</text>
  <text x="610" y="412" class="s">no removals since 10-15;</text>
  <text x="610" y="427" class="s">changes are dated lines</text>

  <!-- E: copies outside -->
  <rect x="800" y="84" width="140" height="160" class="box"/>
  <rect x="800" y="84" width="140" height="24" class="silver"/>
  <text x="810" y="101" class="k">dated, not ours</text>
  <text x="810" y="128" class="n">the hash, posted</text>
  <text x="810" y="144" class="n">outside the chat</text>
  <text x="810" y="166" class="n">Internet Archive,</text>
  <text x="810" y="182" class="n">every day</text>
  <text x="810" y="204" class="n">a Bitcoin stamp</text>
  <text x="810" y="220" class="s">(not made yet)</text>

  <rect x="800" y="276" width="140" height="160" class="box"/>
  <rect x="800" y="276" width="140" height="24" class="silver"/>
  <text x="810" y="293" class="k">the site</text>
  <text x="810" y="320" class="n">built from the</text>
  <text x="810" y="336" class="n">texts beside it</text>
  <text x="810" y="360" class="s">adds no rule. Shows</text>
  <text x="810" y="375" class="s">every entry, the</text>
  <text x="810" y="390" class="s">check card, the</text>
  <text x="810" y="405" class="s">vote buttons and</text>
  <text x="810" y="420" class="s">"closed so far"</text>

  <!-- the weekly turn, under the chat and the file -->
  <rect x="430" y="470" width="350" height="116" class="box"/>
  <rect x="430" y="470" width="350" height="24" class="silver"/>
  <text x="440" y="487" class="k">the weekly turn (rule 6): one member a week</text>
  <text x="440" y="512" class="n">pastes the week's chat into the weekly page,</text>
  <text x="440" y="528" class="n">copies what it gives into ledger.txt: SEEN</text>
  <text x="440" y="544" class="n">lines, new entries, vote counts; then posts</text>
  <text x="440" y="560" class="n">the file's hash outside the chat. A turn</text>
  <text x="440" y="576" class="n">not done passes to the next member.</text>

  <!-- arrows -->
  <path d="M190,130 L215,130" class="arrow"/>
  <path d="M190,250 L215,250" class="arrow"/>
  <path d="M190,368 L205,368 L205,300 L215,300" class="arrow"/>
  <path d="M415,130 L440,130" class="arrow"/>
  <path d="M415,250 L440,250" class="arrow"/>
  <path d="M415,392 L440,392" class="arrow"/>
  <path d="M510,436 L510,470" class="arrow"/>
  <text x="518" y="458" class="lab">the week's posts</text>
  <path d="M690,470 L690,436" class="arrow"/>
  <text x="698" y="458" class="lab">the lines to add</text>
  <path d="M780,160 L800,160" class="arrow"/>
  <path d="M780,350 L800,350" class="arrow"/>

  <!-- the one rule of flow -->
  <text x="20" y="618" class="k">Every chat result gets into the file by the weekly turn. An entry closes only on two SEEN lines.</text>
  <text x="20" y="636" class="k">The file is the record. The day a close counts is the day of its second post.</text>
  <text x="20" y="662" class="s">entry: one claim with its link and WRONG IF, OPEN until two checks agree  ·  check: a member opened the link and said what they saw</text>
  <text x="20" y="678" class="s">script: a program that reads the record for one entry  ·  weekly turn: the member who copies this week's chat into the file</text>
</svg>
