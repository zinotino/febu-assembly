<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>febu-assembly members</title>
  <style>
    :root { --bg: #00002b; --fg: #111; --navy: #1f1a8c; --silver: #c0c0c0; --raised: #d4d0c8; --check: #1d9bf0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg) radial-gradient(circle,#9fb0ff 0 1px,transparent 1.6px) 0 0/97px 97px; color: var(--fg); font-family: "Courier New", Courier, monospace; font-size: 14px; line-height: 1.5; }
    .wrap { max-width: 640px; margin: 28px auto; padding: 0 16px; }
    .box { border: 3px solid; border-color: #fff #404040 #404040 #fff; background: var(--silver); box-shadow: 0 0 0 1px #000, 8px 8px 0 rgba(0,0,0,.5); padding: 16px; }
    h1 { font-size: 18px; text-align: center; margin: -16px -16px 14px; padding: 4px; color: #fff; background: linear-gradient(90deg,#000080,#1084d0); }
    .lede { margin: 0 0 12px; }
    ul { list-style: none; margin: 0; padding: 0; border: 2px solid; border-color: #404040 #fff #fff #404040; background: #fff; }
    li { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; }
    li + li { border-top: 1px solid #c8c8c8; }
    .av { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: #000080; color: #fff; display: grid; place-items: center; font-weight: bold; font-size: 20px; border: 2px solid #404040; }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .who { min-width: 0; }
    .name { font-weight: bold; overflow-wrap: anywhere; }
    .name .tick { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-left: 4px; }
    .chip { margin-left: 6px; padding: 0 6px; font-size: 11px; background: #404040; color: #fff; }
    .sub { color: #555; font-size: 12px; }
    .status { text-align: right; font-size: 12px; }
    .claimed { color: #1a6b1a; font-weight: bold; }
    button { font: inherit; font-size: 12px; font-weight: bold; color: var(--navy); background: var(--raised); border: 2px solid; border-color: #fff #404040 #404040 #fff; padding: 6px 10px; cursor: pointer; }
    button:active { border-color: #404040 #fff #fff #404040; }
    button:focus-visible, a:focus-visible { outline: 2px dashed var(--navy); outline-offset: 2px; }
    .note { margin: 14px 0 0; font-size: 12px; text-align: center; color: #333; }
    a { color: var(--navy); font-weight: bold; }
    @media (max-width: 480px) {
      li { grid-template-columns: 48px 1fr; }
      .status { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1>members (7)</h1>
      <p class="lede">Each profile is ready. To claim yours, copy the message and paste it in the group chat.</p>
      <ul id="list"></ul>
      <p class="note"><a href="/febu-assembly.html">back to the assembly</a></p>
    </div>
  </div>

  <!-- To mark a profile claimed, set "claimed": true. Add "x" (X handle) and drop assets/pfp/<x lowercase>.jpg to show a picture. -->
  <script type="application/json" id="members">
  [
    {"name": "WitnesstoFebu", "x": "WitnesstoFebu", "verified": true,  "role": "Admin", "claimed": false},
    {"name": "Zurandol",      "x": "Zurandol",      "verified": true,  "claimed": true},
    {"name": "Crypto Fish",   "x": "Fishing4_Crypto",   "verified": true,  "claimed": false},
    {"name": "Merc",          "x": "Mercede95217194",   "verified": false, "claimed": false},
    {"name": "Ksizzle",       "x": "ksizzle0",          "verified": true,  "claimed": false},
    {"name": "Laura",         "x": "eljay1019",         "verified": false, "claimed": false},
    {"name": "CrypticK",      "x": "CrypticTeb",        "verified": false, "claimed": false}
  ]
  </script>

  <script>
    const TICK = '<svg class="tick" viewBox="0 0 24 24" role="img" aria-label="verified"><path fill="#1d9bf0" d="M12 1l2.6 2 3.3-.2 1.2 3.1 2.9 1.6-.9 3.2 .9 3.2-2.9 1.6-1.2 3.1-3.3-.2L12 23l-2.6-2-3.3.2-1.2-3.1-2.9-1.6.9-3.2-.9-3.2 2.9-1.6 1.2-3.1 3.3.2z"/><path fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.5l3 3 6-6.5"/></svg>';
    const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const members = JSON.parse(document.getElementById('members').textContent);
    const list = document.getElementById('list');

    for (const m of members) {
      const li = document.createElement('li');
      const av = m.x
        ? `<img src="/assets/pfp/${esc(m.x.toLowerCase())}.jpg" alt="" onerror="this.remove()">`
        : '';
      li.innerHTML =
        `<div class="av">${av}<span>${esc(m.name[0].toUpperCase())}</span></div>` +
        `<div class="who"><div class="name">${esc(m.name)}${m.verified ? TICK : ''}${m.role ? `<span class="chip">${esc(m.role)}</span>` : ''}</div>` +
        (m.x ? `<div class="sub">@${esc(m.x)}</div>` : '') + `</div>` +
        `<div class="status">${m.claimed ? '<span class="claimed">claimed</span>' : '<button type="button">claim this profile</button>'}</div>`;
      // the initial sits behind the picture; hide it once the picture loads
      const img = li.querySelector('img');
      if (img) { const hide = () => { if (img.isConnected) img.nextElementSibling.hidden = true; }; img.complete ? hide() : img.addEventListener('load', hide); }
      const btn = li.querySelector('button');
      if (btn) btn.addEventListener('click', async () => {
        const msg = `I'm ${m.name} and I'm claiming my profile on the members page.`;
        try { await navigator.clipboard.writeText(msg); btn.textContent = 'copied, paste in chat'; }
        catch { btn.textContent = msg; }
      });
      list.append(li);
    }
  </script>
</body>
</html>
